spring.application.name=template
spring.profiles.active=@spring.active.profile@
server.port=8080
server.http2.enabled=true
server.ssl.enabled=false
spring.mvc.servlet.path=/
server.forward-headers-strategy=framework
################ Config Server
spring.cloud.config.enabled=@config.server.enabled@
spring.cloud.config.label=main
spring.cloud.config.uri=http://config-server:8888
spring.cloud.config.fail-fast=true
################ Logging
logging.config=classpath:logback.xml
################ Flyway Configs
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
################ Spring Data Mogo
spring.data.mongodb.host=mongodb
spring.data.mongodb.port=27017
spring.data.mongodb.database=${spring.application.name}_db
spring.data.mongodb.username=${spring.application.name}_user
spring.data.mongodb.password=
################ Spring Data JPA
spring.datasource.url=jdbc:postgresql://postgresql/${spring.application.name}_db
spring.datasource.username=${spring.application.name}_user
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none
################ Spring Actuator Configs
management.metrics.tags.application=${spring.application.name}
management.endpoints.jmx.exposure.exclude=*
management.endpoints.web.exposure.include=health,refresh,info
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# management.metrics.distribution.slo.http.server.requests=40ms
management.endpoint.health.status.http-mapping.DOWN=200
management.endpoint.health.status.http-mapping.OUT_OF_SERVICE=200
management.endpoint.health.group.readiness.include=mongo,db,diskSpace
management.server.port=8081
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
################ Swagger Configs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v1/api-docs
################# Message Source Configuration
spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8
spring.messages.use-code-as-default-message=true
spring.messages.fallback-to-system-locale=true
################# Scheduled Tasks
sample.scheduled.task.cron=0 */5 * * * *
################# OpenTelemetry Configs
otel.service.version=@project.version@
otel.resource.attributes=service.name=${spring.application.name},service.version=${otel.service.version}
# Tracing
otel.traces.exporter=otlp
otel.exporter.otlp.traces.endpoint=http://otel-collector:4318/v1/traces
otel.exporter.otlp.traces.protocol=http/protobuf
# Metrics
otel.metrics.exporter=otlp
otel.exporter.otlp.metrics.endpoint=http://otel-collector:4318/v1/metrics
otel.exporter.otlp.metrics.protocol=http/protobuf
# Logs
otel.logs.exporter=otlp
otel.exporter.otlp.logs.endpoint=http://otel-collector:4318/v1/logs
otel.exporter.otlp.logs.protocol=http/protobuf
# Tracing Sampling
otel.traces.sampler=traceidratio
otel.traces.sampler.arg=1.0

