dummy-event.topic=sample_event_topic

spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.isolation-level=read_committed
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.company.*,java.util,java.lang


spring.kafka.producer.acks=all
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.batch-size=0
spring.kafka.producer.client-id=${spring.application.name}
spring.kafka.producer.transaction-id-prefix=${spring.application.name}-tx-
spring.kafka.producer.properties.max.in.flight.requests.per.connection=1
spring.kafka.producer.properties.retries=3
spring.kafka.producer.properties.retry.backoff.ms=100
spring.kafka.producer.properties.enable-idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=3000
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.producer.properties.partitioner=org.apache.kafka.clients.producer.RoundRobinPartitioner


spring.kafka.listener.async-acks=false
spring.kafka.listener.ack-mode=record
spring.kafka.listener.type=single
spring.kafka.listener.concurrency=5

